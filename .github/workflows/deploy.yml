# Uploads the workspace to Hostinger (ws.brxel.co) on every push to site-dev.
# Needs the repository secrets FTP_USERNAME and FTP_PASSWORD
# (Hostinger > Files > FTP Accounts; the account opens in .../brxel.co/public_html/ws).
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   FTP_HOST  FTP server, default 82.198.230.29 (the FTP IP; ftp.brxel.co has no DNS record)
#   FTP_DIR   folder on the FTP account, default the account's own folder
#
# Files are uploaded with curl and only added or replaced, never deleted, so data/workspace.json, data/backups
# and config.local.php on the server are never touched.

name: Deploy to Hostinger

on:
  push:
    branches: [site-dev]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  FTP_HOST: ${{ vars.FTP_HOST || '82.198.230.29' }}
  FTP_DIR: ${{ vars.FTP_DIR || './' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: for f in *.php app/*.php; do php -l "$f"; done

      - name: Prepare the files to upload
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'start workspace.bat' \
            --exclude 'start.sh' --exclude 'router.php' ./ "$RUNNER_TEMP/site/"
          find "$RUNNER_TEMP/site" -type f | sed "s#^$RUNNER_TEMP/site/#  #" | sort

      - name: Upload over FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Add the FTP_USERNAME and FTP_PASSWORD secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "On the server now:"
          curl -sS --max-time 30 --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/${FTP_DIR#./}" | sed 's/^/  /' || true
          cd "$RUNNER_TEMP/site"
          prefix="${FTP_DIR#./}"
          args=()
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            args+=(-T "$rel" "ftp://$FTP_HOST/$prefix${rel// /%20}")
          done < <(find . -type f -print0 | sort -z)
          # One connection for all files; folders are created as needed and nothing is deleted.
          set +e
          curl -sS --fail --ftp-create-dirs --retry 3 --user "$FTP_USER:$FTP_PASS" \
            -w '%{response_code} %{url_effective}\n' "${args[@]}"
          code=$?
          set -e
          if [ "$code" = 67 ]; then
            echo "::error::Hostinger refused the FTP username or password. Copy them again from Hostinger > Files > FTP Accounts into the FTP_USERNAME and FTP_PASSWORD secrets."
          fi
          exit "$code"

      - name: Check the site answers
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: ws.brxel.co' "http://$FTP_HOST/") || true
          echo "ws.brxel.co answered with HTTP $code (200 = workspace, 301/302 = redirect to https)."

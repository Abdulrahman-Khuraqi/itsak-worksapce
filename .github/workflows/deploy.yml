# Uploads the workspace to Hostinger (ws.brxel.co) on every push to site-dev.
# Needs the repository secrets FTP_USERNAME and FTP_PASSWORD.
# Optional repository variables (Settings > Secrets and variables > Actions > Variables):
#   FTP_HOST  FTP server, default 82.198.230.29 (Hostinger > Files > FTP Accounts > FTP IP)
#   FTP_DIR   target folder on the FTP account, ending in "/". When not set, the folder is
#             public_html/ws/ if the account can see public_html, otherwise the account's own folder.
#
# Only files from this repo are uploaded or removed. data/workspace.json, data/backups
# and config.local.php live only on the server and are never touched.

name: Deploy to Hostinger

on:
  push:
    branches: [site-dev]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

env:
  FTP_HOST: ${{ vars.FTP_HOST || '82.198.230.29' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: for f in *.php lib/*.php; do php -l "$f"; done

      - name: Find the target folder
        id: target
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Add the FTP_USERNAME and FTP_PASSWORD secrets under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! listing=$(curl -sS --max-time 30 --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/"); then
            echo "::error::Could not sign in to $FTP_HOST. Check FTP_USERNAME and FTP_PASSWORD (Hostinger > Files > FTP Accounts)."
            exit 1
          fi
          echo "Folders and files at the FTP account's root:"
          echo "$listing" | sed 's/^/  /'
          dir="$FTP_DIR"
          if [ -z "$dir" ]; then
            if echo "$listing" | grep -qx 'public_html'; then dir='public_html/ws/'; else dir='./'; fi
          fi
          echo "Uploading to: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.target.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            data/workspace.json*
            data/backups/**
            data/.lock
            config.local.php
            start workspace.bat
            start.sh
            router.php

      - name: Check the site answers
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: ws.brxel.co' "http://$FTP_HOST/") || true
          echo "ws.brxel.co answered with HTTP $code (200 = workspace, 302 = redirect to https)."
